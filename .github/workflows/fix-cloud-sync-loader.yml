name: Fix Fishing Day cloud sync loader

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-cloud-sync-loader.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Place loader before final body close
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          text = text.replace('  <script src="cloud-sync.js?v=1"></script>\n', '')
          marker = '</body>'
          pos = text.rfind(marker)
          if pos < 0:
              raise SystemExit('Closing body tag not found')
          text = text[:pos] + '  <script src="cloud-sync.js?v=1"></script>\n' + text[pos:]
          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit fix
        shell: bash
        run: |
          set -e
          if git diff --quiet; then
            echo 'No changes.'
            exit 0
          fi
          git config user.name 'korytnik-hub-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix shared cloud sync loader placement'
          git pull --rebase origin main
          git push origin main
