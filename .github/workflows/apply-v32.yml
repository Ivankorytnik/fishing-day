name: Apply Fishing Day v32

on:
  push:
    paths:
      - 'deploy/v32.patch.part*'
      - '.github/workflows/apply-v32.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply v32 patch
        shell: bash
        run: |
          cat deploy/v32.patch.part* > /tmp/v32.patch
          git apply --check /tmp/v32.patch
          git apply /tmp/v32.patch
          rm -rf deploy
          rm -f .github/workflows/apply-v32.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy Fishing Day v32"
          git push
