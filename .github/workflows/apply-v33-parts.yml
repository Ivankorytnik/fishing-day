name: Publish Fishing Day v33

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v33-parts.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply v33
        run: |
          cat deploy/v33-index.part00 deploy/v33-index.part01 deploy/v33-index.part02 deploy/v33-index.part03 > /tmp/v33.patch
          git apply --check /tmp/v33.patch
          git apply /tmp/v33.patch
          rm -rf deploy
          rm -f .github/workflows/apply-v33.yml
          rm -f .github/workflows/apply-v33-parts.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy Fishing Day v33 recalibrated forecast"
          git push
