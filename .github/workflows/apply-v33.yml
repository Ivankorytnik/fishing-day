name: Apply Fishing Day v33

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v33.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply recalibrated forecast model
        env:
          PATCH_B64: 
        run: |
          printf '%s' "$PATCH_B64" | base64 -d | gzip -d > /tmp/v33.patch
          git apply --check /tmp/v33.patch
          git apply /tmp/v33.patch
          rm -f .github/workflows/apply-v33.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy Fishing Day v33 recalibrated forecast"
          git push
