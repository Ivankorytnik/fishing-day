name: Publish Fishing Day v35

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v35.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply v35 minimal interface
        env:
          PATCH_XZ_B64: 
        run: |
          printf '%s' "$PATCH_XZ_B64" | base64 -d | xz -d > /tmp/v35.patch
          git apply --check /tmp/v35.patch
          git apply /tmp/v35.patch
          rm -f .github/workflows/publish-v35.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy Fishing Day v35 minimal interface"
          git push
